site_name: pseudoWeb Docs
site_description: Documentación técnica del core de pseudoWeb
site_dir: site

theme:
  name: material
  language: es
  features:
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - content.code.copy

plugins:
  - search
  - mermaid2

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Inicio: index.md
  - Core: core.md
  - Referencias:
      - Lexer: core/lexer.md
      - Parser: core/parser.md
      - Interpreter: core/interpreter.md